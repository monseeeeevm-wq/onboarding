spring.application.name=onboarding
spring.profiles.active=local
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Integración Gestopago ---
gestopago.base-url=https://gestopago.portalventas.net
gestopago.authenticate-path=/sistema/app/jwt-gp/authenticate/
gestopago.product-list-path=/sistema/service/getProductList.do
gestopago.send-tx-path=/sistema/service/sendTx.do
gestopago.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:}
gestopago.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:}
gestopago.password=${GESTOPAGO_PASSWORD:}
gestopago.connect-timeout-ms=3000
gestopago.read-timeout-ms=10000